x-airflow-common: &airflow-common
  build: .
  env_file:
    - ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # dbt installs packages into a subdir INSIDE the dbt_packages named volume (below).
    # It can't be the volume's mount root: `dbt deps` rmtree's its install path, and a
    # mount point can't be removed (Errno 16). This subdir is a normal dir dbt can manage.
    DBT_PACKAGES_PATH: dbt_packages/lib
    # Smart city DB connection (used by dbt staging target inside container)
    SMART_CITY_PG_HOST: host.docker.internal
    SMART_CITY_PG_PORT: '5432'
    SMART_CITY_PG_DB: smart_city
    SMART_CITY_PG_USER: postgres
    SMART_CITY_PG_PASSWORD: ${POSTGRES_PASSWORD}
    # Airbyte OAuth credentials (used by airbyte_utils.py + the reconcile_airbyte task)
    AIRBYTE_URL: 'http://host.docker.internal:8000'
    AIRBYTE_CLIENT_ID: ${AIRBYTE_CLIENT_ID}
    AIRBYTE_CLIENT_SECRET: ${AIRBYTE_CLIENT_SECRET}
    # setup_airbyte.reconcile() (run by the reconcile_airbyte task) writes here — the
    # mounted config dir, since the container's script path differs from the repo layout.
    CONNECTION_IDS_FILE: /opt/airflow/ingestion_config/connection_ids.yml
    # Gemini — the model call in the daily smart_city_ai_summary DAG. The key itself
    # comes from the repo-root .env via env_file above; GEMINI_MODEL is pinned here so
    # the DAG and the mart_city_summary.model label always agree on one default.
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../dbt:/opt/airflow/dbt
    - ../ingestion/config:/opt/airflow/ingestion_config
    # setup_airbyte.py so the reconcile_airbyte task can import reconcile() (auto-detect:
    # apply new config.* sources/cities to Airbyte). env_file already gives the container
    # the API keys + Airbyte creds; it connects to the config DB via SMART_CITY_PG_*.
    - ../ingestion/scripts:/opt/airflow/ingestion_scripts
    # AI city-summary scripts, imported by the smart_city_ai_summary DAG (fetch →
    # generate → load). Read-write so the generate task can keep its audit copy of
    # what the model wrote in ai/_outputs/ on the host.
    - ../ai:/opt/airflow/ai
    # ml/ package, run by the smart_city_ml DAG (train → predict → report) via the
    # image's ml_venv. Writable on purpose: train.py saves models into ml/_models/,
    # which is gitignored build output.
    - ../ml:/opt/airflow/ml
    # Named volume for dbt packages (dbt_utils), layered over the ../dbt bind mount at
    # just the dbt_packages/ subpath. dbt installs into the dbt_packages/lib subdir of it
    # (see DBT_PACKAGES_PATH above). Populated ONCE via a manual `dbt deps` (see README /
    # CLAUDE.md), then persists across container restarts and image rebuilds — so the
    # hourly DAG no longer needs a per-run `dbt deps` step. Wiped only by
    # `docker compose down -v`, after which re-run the populate command. dbt_packages/ is
    # gitignored and the project is bind-mounted, so it can't be baked into the image (the
    # mount would shadow it) — a durable volume is the stable alternative.
    - dbt_packages:/opt/airflow/dbt/smart_city/dbt_packages
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@smartcity.local || true"
    restart: "no"

volumes:
  # Persists dbt_packages/ (dbt_utils) across restarts/rebuilds. Populate once with the
  # one-time `dbt deps` command in the README's Airflow section. Removed by `down -v`.
  dbt_packages:
